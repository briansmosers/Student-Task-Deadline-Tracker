<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <div class="profile-card">
            <h2>Login</h2>
            {% if error %}
                <p style="color: red;"><strong>{{ error }}</strong></p>
            {% endif %}
            <form method="POST">
                <label>Username</label><br>
                <input type="text" name="username" required><br><br>
                <label>User Tag</label><br>
                <input type="text" name="tag" placeholder="0001" required><br><br>
                <button type="submit">Login</button>
            </form>
            <p style="margin-top: 15px;">Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
        </div>
    </main>
</body>
</html>
