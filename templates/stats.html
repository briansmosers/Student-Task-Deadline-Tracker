<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Stats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ 'dark' if user and user.dark_mode else '' }}">
    <nav>
        <ul>
            <li><button><a href="{{ url_for('home') }}">Back to Assignments</a></button></li>
            <li><button><a href="{{ url_for('profile') }}">Profile</a></button></li>
            <li><button><a href="{{ url_for('settings') }}">Settings</a></button></li>
            <li><button><a href="{{ url_for('logout') }}">Logout</a></button></li>
            <li><button><a href="{{ url_for('delete_account') }}">Delete Account</a></button></li>
        </ul>
    </nav>
    <main>
        <div class="profile-card">
            <h2>Your Stats</h2>
            <hr>
            <p>Username: <strong>{{ user.username }}</strong></p>
            <p>Tag: <strong>#{{ user.tag }}</strong></p>
            <p>Total Assignments: <strong>{{ total }}</strong></p>
            <p>Completed: <strong>{{ completed }}</strong></p>
            <p>Pending: <strong>{{ pending }}</strong></p>
            <hr>
            <p>Completion Rate: <strong>{{ percent }}%</strong></p>
        </div>
    </main>
</body>
</html>
