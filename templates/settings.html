<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ 'dark' if user and user.dark_mode else '' }}">
    <nav>
        <ul>
            <li><button><a href="{{ url_for('home') }}">Back to Assignments</a></button></li>
            <li><button><a href="{{ url_for('profile') }}">Profile</a></button></li>
            <li><button><a href="{{ url_for('stats') }}">Your Stats</a></button></li>
            <li><button><a href="{{ url_for('logout') }}">Logout</a></button></li>
            <li><button><a href="{{ url_for('delete_account') }}">Delete Account</a></button></li>
        </ul>
    </nav>
    <main>
        <div class="profile-card">
            <h2>Settings</h2>
            <hr>
            <form method="POST">
                <p>
                    <label>
                        <input type="checkbox" name="dark_mode" {% if user.dark_mode %}checked{% endif %}> Dark Mode
                    </label>
                </p>
                <hr>
                <button type="submit">Save Settings</button>
            </form>
        </div>
    </main>
</body>
</html>
