<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ 'dark' if user and user.dark_mode else '' }}">
    <nav>
        <ul>
            <li><button><a href="{{ url_for('home') }}">Back to Assignments</a></button></li>
            <li><button><a href="{{ url_for('profile') }}">Profile</a></button></li>
            <li><button><a href="{{ url_for('stats') }}">Your Stats</a></button></li>
            <li><button><a href="{{ url_for('clock') }}">Study Sessions</a></button></li>
        </ul>
    </nav>
    <main>
        <div class="profile-card">
            <h2>Settings</h2>
            <hr>
            <div class="settings-actions">
                <form method="POST" action="{{ url_for('settings') }}">
                    <p>
                        <label>
                            <input type="checkbox" name="dark_mode" {% if user.dark_mode %}checked{% endif %}> Dark Mode
                        </label>
                    </p>
                    <button type="submit">Save Settings</button>
                </form>

                <form method="POST" action="{{ url_for('logout') }}" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="danger-btn">Logout</button>
                </form>

                <form method="POST" action="{{ url_for('delete_account') }}" onsubmit="return confirm('Delete your account permanently?');">
                    <button type="submit" class="danger-btn">Delete Account</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
