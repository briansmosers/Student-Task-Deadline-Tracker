<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><button><a href="{{ url_for('home') }}">Home</a></button></li>
            <li><button><a href="{{ url_for('profile') }}">Profile</a></button></li>
            <li><button><a href="{{ url_for('dashboard') }}">Tasks</a></button></li>
            <li><button><a href="{{ url_for('clock') }}">Study Sessions</a></button></li>
            <li><button><a href="{{ url_for('stats') }}">Stats</a></button></li>
        </ul>
    </nav>
    <main>
        <div class="profile-card">
            <h2>Settings</h2>
            <hr>
            <div class="settings-actions">
                <form method="POST" action="{{ url_for('logout') }}" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="danger-btn">Logout</button>
                </form>

                <form method="POST" action="{{ url_for('delete_account') }}" onsubmit="return confirm('Delete your account permanently?');">
                    <button type="submit" class="danger-btn">Delete Account</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
