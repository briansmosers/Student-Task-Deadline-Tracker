<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Study Station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --page-bg: #a7b9a3;
            --panel-bg: #d4dcc9;
            --panel-border: #777b76;
            --text: #111;
            --accent: #86a57d;
            --shadow: 8px 8px 0 rgba(0,0,0,0.75);
            --input-bg: #f2f2e6;
        }

        @font-face {
            font-family: 'Radiohead';
            src: url("{{ url_for('static', filename='uploads/font/EUROSWH.ttf') }}") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Radiohead', 'Courier New', monospace;
            color: var(--text);
            background: var(--page-bg);
            overflow: hidden;
        }

        .main-display {
            height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding-left: 240px;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 3px outset var(--panel-border);
            box-shadow: var(--shadow);
            padding: 20px 14px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar li {
            margin: 0;
        }

        .sidebar button {
            width: 100%;
            border-radius: 0;
            background: transparent;
            border: 2px inset var(--panel-border);
            color: var(--text);
            padding: 10px 12px;
            font-family: 'Radiohead', 'Courier New', monospace;
            font-weight: normal;
            text-align: left;
            cursor: pointer;
        }

        .sidebar button a {
            color: inherit;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .sidebar button:hover {
            background: rgba(0,0,0,0.05);
        }

        .sidebar button:active {
            border-style: inset;
        }

        #digital-clock {
            font-family: 'Radiohead', 'Courier New', monospace;
            font-size: 11vw; font-weight: normal;
            letter-spacing: 0.12em;
            text-shadow: 6px 6px 0 rgba(0,0,0,0.6);
            margin-bottom: 0.25rem;
        }

        #current-date {
            font-family: 'Radiohead', 'Courier New', monospace;
            font-size: 1.9rem; font-weight: normal;
            letter-spacing: 0.35em; text-transform: uppercase;
            opacity: 0.95;
        }

        .panel {
            background: var(--panel-bg);
            border: 3px outset var(--panel-border);
            padding: 22px;
            box-shadow: var(--shadow);
            color: var(--text);
        }

        .task-panel {
            position: fixed; bottom: 40px; left: 260px;
            width: 340px;
        }

        .task-panel h6 {
            font-family: 'Radiohead', 'Courier New', monospace;
            font-weight: normal;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }

        .task-input {
            background: var(--input-bg);
            border: 2px inset #fff;
            color: var(--text);
            padding: 10px;
            font-family: 'Radiohead', 'Courier New', monospace;
            font-size: 0.95rem;
        }

        .task-item {
            display: flex; align-items: center; gap: 10px; margin-top: 12px;
            font-family: 'Radiohead', 'Courier New', monospace;
        }

        .task-item input[type="checkbox"] { accent-color: var(--accent); }
        .completed { text-decoration: line-through; opacity: 0.5; }

        .stopwatch-panel {
            position: fixed; bottom: 40px; right: 40px;
            width: 320px;
            text-align: center;
        }

        #sw-display {
            font-family: 'Radiohead', 'Courier New', monospace;
            font-size: 3rem; font-weight: normal; display: block;
            margin-bottom: 16px;
            color: var(--accent);
            text-shadow: 3px 3px 0 rgba(0,0,0,0.6);
        }

        .btn-custom {
            border-radius: 0;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-family: 'Radiohead', 'Courier New', monospace;
            font-weight: normal;
            border: 2px outset var(--panel-border);
        }

        .task-panel .input-group,
        .stopwatch-panel .d-flex {
            gap: 8px;
        }

        body.dark {
            background: #3a3a3c;
            color: #f5f5f5;
        }

        body.dark .panel {
            background: #222;
            border-color: #444;
            color: #f5f5f5;
        }

        body.dark .task-input {
            background: #2b2b2d;
            color: #f5f5f5;
            border-color: #555;
        }

        body.dark .btn-custom,
        body.dark .btn-light,
        body.dark .btn-success,
        body.dark .btn-outline-light {
            background: #333 !important;
            color: #f5f5f5 !important;
            border-color: #555 !important;
        }

        body.dark #digital-clock {
            color: #c5d4b0;
            text-shadow: 6px 6px 0 rgba(0,0,0,0.85);
        }
    </style>
</head>
<body class="{{ 'dark' if user and user.dark_mode else '' }}">

    <nav class="sidebar">
        <ul>
            <li><button><a href="{{ url_for('home') }}">Back to Assignments</a></button></li>
            <li><button><a href="{{ url_for('profile') }}">Profile</a></button></li>
            <li><button><a href="{{ url_for('stats') }}">Your Stats</a></button></li>
            <li><button><a href="{{ url_for('settings') }}">Settings</a></button></li>
        </ul>
    </nav>

    <!-- Main Clock & Date -->
    <div class="main-display">
        <h1 id="digital-clock">00:00:00</h1>
        <div id="current-date">MONDAY, MAY 05</div>
    </div>

    <!-- Task List (Left) -->
    <div class="task-panel panel">
        <h6 class="fw-bold mb-3">Study Progress</h6>
        <div class="input-group mb-2">
            <input type="text" id="taskInput" class="form-control task-input" placeholder="New Task...">
            <button class="btn btn-sm btn-light" onclick="addTask()">+</button>
        </div>
        <div id="taskList"></div>
    </div>

    <!-- Stopwatch (Right) -->
    <div class="stopwatch-panel panel">
        <span id="sw-display">00:00:00</span>
        <div class="d-flex gap-2 justify-content-center">
            <button id="startBtn" class="btn btn-success btn-custom" onclick="toggleSW()">Start Study</button>
            <button class="btn btn-outline-light btn-custom" onclick="resetSW()">Reset</button>
        </div>
    </div>

    <script>
        // 1. Clock & Date Logic
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;

            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString(undefined, options).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Stopwatch Logic (FIXED RESET)
        let startTime, timerInterval, elapsedTime = 0, isRunning = false;

        function toggleSW() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateDisplay();
                }, 100);
                document.getElementById('startBtn').innerText = "Pause";
                isRunning = true;
            } else {
                clearInterval(timerInterval);
                document.getElementById('startBtn').innerText = "Resume";
                isRunning = false;
            }
        }

        function resetSW() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            updateDisplay();
            document.getElementById('startBtn').innerText = "Start Study";
        }

        function updateDisplay() {
            let totalSeconds = Math.floor(elapsedTime / 1000);
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            document.getElementById('sw-display').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // 3. Task List Logic
        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim() === "") return;

            const taskList = document.getElementById('taskList');
            const div = document.createElement('div');
            div.className = "task-item";
            div.innerHTML = `
                <input type="checkbox" onchange="this.nextSibling.classList.toggle('completed')">
                <span>${input.value}</span>
            `;
            taskList.appendChild(div);
            input.value = "";
        }
    </script>
</body>
</html>
